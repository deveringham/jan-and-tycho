[project]
name = "rudolf"
version = "0.1.0"
description = "Rudolf: the referee. Scores hypotheses against sealed truth and draws every figure."
requires-python = ">=3.11"
dependencies = ["jt-core", "sympy>=1.12", "matplotlib>=3.8", "pillow>=10", "jinja2>=3.1"]

[project.optional-dependencies]
plots = ["arviz>=0.18", "corner>=2.2", "seaborn>=0.13"]
explorer = ["plotly>=5.20"]

[tool.uv.sources]
jt-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rudolf"]
