[project]
name = "jan"
version = "0.1.0"
description = "Jan: inverse-problem strategies that recover models and laws from observations."
requires-python = ">=3.11"
dependencies = ["jt-core", "sympy>=1.12"]

[project.optional-dependencies]
bayes = ["emcee>=3.1", "numpyro>=0.15", "dynesty>=2.1"]
gp = ["tinygp>=0.3"]
discovery = ["pysindy>=1.7", "pysr>=0.19"]
piml = ["optax>=0.2", "equinox>=0.11"]
sbi = ["sbi>=0.23", "torch>=2.2"]
llm = ["anthropic>=0.40"]

[tool.uv.sources]
jt-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jan"]
