[project]
name = "tycho"
version = "0.1.0"
description = "Tycho: forward simulator of noisy, incomplete sky observations."
requires-python = ">=3.11"
dependencies = ["jt-core", "sympy>=1.12"]

[tool.uv.sources]
jt-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tycho"]
