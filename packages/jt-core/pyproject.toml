[project]
name = "jt-core"
version = "0.1.0"
description = "Shared, truth-agnostic math, frames, conics and schema for Jan and Tycho."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "jax>=0.4.30",
    "diffrax>=0.6",
    "pydantic>=2.6",
    "pyyaml>=6",
    "pyarrow>=15",
    "pandas>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jt_core"]
