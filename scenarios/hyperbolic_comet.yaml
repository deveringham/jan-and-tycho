name: hyperbolic_comet
description: >-
  A single apparition of a hyperbolic comet (e ≈ 1.2). It is only bright enough to see near
  perihelion (activity-driven magnitude limit). Can Jan tell e > 1 from a long ellipse?
duration_days: 500
holdout_fraction: 0.25
knowledge_tier: T1

observer:
  type: keplerian
  elements: {q: 0.98329, e: 0.0167, i_deg: 0.0, Omega_deg: 0.0, omega_deg: 102.94, t_p: 2.0}

bodies:
  - id: target
    truth:
      type: keplerian
      elements: {q: 1.1, e: 1.2, i_deg: 38.0, Omega_deg: 330.0, omega_deg: 60.0, t_p: 300.0}
    photometry: {H: 5.0, kappa: 4.0}

schedule:
  type: regular
  cadence_days: 2
  jitter_days: 0.5
  visibility:
    min_solar_elongation_deg: 25
    max_magnitude: 11.0
    dropout_prob: 0.25

noise:
  - {type: gaussian, sigma_arcsec: 5}
