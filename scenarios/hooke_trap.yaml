name: hooke_trap
description: >-
  Linear central force f = −k r: a closed ellipse *centred* on the Sun with a period
  independent of size. Looks Keplerian at a glance; it is not.
duration_days: 7300
holdout_fraction: 0.25
knowledge_tier: T1
observer:
  type: keplerian
  elements: {q: 0.98329, e: 0.0167, i_deg: 0.0, Omega_deg: 0.0, omega_deg: 102.94, t_p: 2.0}
bodies:
  - id: target
    truth:
      type: central_force
      law: hooke
      k_per_day2: 8.364e-5          # ω = 2π / 687 d
      initial: {position_au: [1.6, 0.0, 0.0], velocity_au_per_day: [0.0, 0.01189, 0.0004]}
schedule:
  type: regular
  cadence_days: 10
  jitter_days: 2
  visibility:
    min_solar_elongation_deg: 15
    dropout_prob: 0.2
noise:
  - {type: gaussian, sigma_arcsec: 60}
