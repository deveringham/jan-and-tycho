name: realism_mars
description: >-
  Mars-like orbit with modern (1″) astrometry reported as apparent equatorial positions:
  light-time, annual aberration and right ascension/declination. Ignoring the effects
  leaves ~10″ (light-time) and ~20″ (aberration) systematics.
duration_days: 7300
holdout_fraction: 0.25
knowledge_tier: T1

observer:
  type: keplerian
  elements: {q: 0.98329, e: 0.0167, i_deg: 0.0, Omega_deg: 0.0, omega_deg: 102.94, t_p: 2.0}

bodies:
  - id: target
    truth:
      type: keplerian
      elements: {q: 1.381, e: 0.0934, i_deg: 1.85, Omega_deg: 49.6, omega_deg: 286.5, t_p: 120.0}
    photometry: {H: -1.5}

schedule:
  type: regular
  cadence_days: 10
  jitter_days: 2
  visibility:
    min_solar_elongation_deg: 15
    dropout_prob: 0.2

noise:
  - {type: gaussian, sigma_arcsec: 1}

realism: {light_time: true, aberration: true, frame: equatorial}
