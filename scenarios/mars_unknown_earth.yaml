name: mars_unknown_earth
description: >-
  Kepler's actual problem (T2): Mars-like body plus Tycho's noisy Sun-direction stream; the
  Earth's orbit is NOT given. Recover Earth's eccentricity and Mars's orbit together.
duration_days: 7300
holdout_fraction: 0.25
knowledge_tier: T2

observer:
  type: keplerian
  elements: {q: 0.98329, e: 0.0167, i_deg: 0.0, Omega_deg: 0.0, omega_deg: 102.94, t_p: 2.0}

bodies:
  - id: target
    truth:
      type: keplerian
      elements: {q: 1.381, e: 0.0934, i_deg: 1.85, Omega_deg: 49.6, omega_deg: 286.5, t_p: 120.0}
    photometry: {H: -1.5}

schedule:
  type: regular
  cadence_days: 10
  jitter_days: 2
  visibility:
    min_solar_elongation_deg: 15
    dropout_prob: 0.2

noise:
  - {type: gaussian, sigma_arcsec: 60}
