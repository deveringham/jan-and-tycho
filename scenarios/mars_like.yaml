name: mars_like
description: Mars-like ellipse observed with Tycho-level precision (~60″), Earth known (T1).
duration_days: 7300
holdout_fraction: 0.25
knowledge_tier: T1
epoch_calendar: "1580-01-01 (cosmetic)"

observer:
  type: keplerian
  elements: {q: 0.98329, e: 0.0167, i_deg: 0.0, Omega_deg: 0.0, omega_deg: 102.94, t_p: 2.0}

bodies:
  - id: target
    truth:
      type: keplerian
      elements: {q: 1.381, e: 0.0934, i_deg: 1.85, Omega_deg: 49.6, omega_deg: 286.5, t_p: 120.0}
    photometry: {H: -1.5}

schedule:
  type: regular
  cadence_days: 10
  jitter_days: 2
  visibility:
    min_solar_elongation_deg: 15
    max_magnitude: 6.0
    dropout_prob: 0.2

noise:
  - {type: gaussian, sigma_arcsec: 60}
  - {type: quantize, step_arcsec: 30}
