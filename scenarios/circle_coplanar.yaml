name: circle_coplanar
description: Sanity check. Circular, coplanar orbit at 1.52 AU, low noise, Earth known (T1).
duration_days: 3650
holdout_fraction: 0.25
knowledge_tier: T1

observer:
  type: keplerian
  elements: {q: 0.98329, e: 0.0167, i_deg: 0.0, Omega_deg: 0.0, omega_deg: 102.94, t_p: 2.0}

bodies:
  - id: target
    truth:
      type: circular
      radius_au: 1.52
      i_deg: 0.0
      phase_deg: 40.0

schedule:
  type: regular
  cadence_days: 10
  jitter_days: 2
  visibility:
    dropout_prob: 0.1

noise:
  - {type: gaussian, sigma_arcsec: 10}
